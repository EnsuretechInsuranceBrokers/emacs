# tmux, gruber-darker status bar.  Installed by fedora/rice.sh.

set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB"
set -s escape-time 0          # no Esc delay: matters for Vim keys in Emacs/nvim
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi          # copy mode: v to select, y to copy

# Splits keep the current directory.  | vertical, - horizontal.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# hjkl between panes, HJKL to resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Colours
set -g status-style "bg=#282828,fg=#e4e4ef"
set -g status-left "#[bg=#ffdd33,fg=#181818,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#95a99f]%a %d %b  #[fg=#ffdd33]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#453d41,fg=#ffdd33,bold] #I #W "
set -g pane-border-style "fg=#453d41"
set -g pane-active-border-style "fg=#ffdd33"
set -g message-style "bg=#282828,fg=#ffdd33"
setw -g mode-style "bg=#453d41,fg=#e4e4ef"
