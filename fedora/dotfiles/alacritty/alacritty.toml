# Alacritty, gruber-darker colours to match Emacs.  Installed by fedora/rice.sh.

[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
opacity = 1.0

[font]
normal = { family = "Iosevka", style = "Regular" }
bold = { family = "Iosevka", style = "Bold" }
italic = { family = "Iosevka", style = "Italic" }
size = 14.0

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 50000

[selection]
save_to_clipboard = true

[colors.primary]
background = "#181818"
foreground = "#e4e4ef"

[colors.cursor]
text = "#181818"
cursor = "#ffdd33"

[colors.selection]
text = "CellForeground"
background = "#453d41"

[colors.normal]
black   = "#282828"
red     = "#f43841"
green   = "#73c936"
yellow  = "#ffdd33"
blue    = "#96a6c8"
magenta = "#9e95c7"
cyan    = "#95a99f"
white   = "#e4e4ef"

[colors.bright]
black   = "#52494e"
red     = "#ff4f58"
green   = "#8ae234"
yellow  = "#ffff66"
blue    = "#b4c2e0"
magenta = "#b8aee0"
cyan    = "#b3c5bc"
white   = "#f4f4ff"
